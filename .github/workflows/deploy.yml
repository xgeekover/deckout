# main 에 push 될 때마다 빌드해서 GitHub Pages 에 배포한다.
# 결과: https://xgeekover.github.io/deckout/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한만 준다.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 앞선 것은 끝까지 두고 대기 중인 것만 최신으로 바꾼다 (배포 도중 취소하면 사이트가 반쯤 올라간 상태가 될 수 있다).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
